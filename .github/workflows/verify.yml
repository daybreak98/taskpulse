name: Verify TaskPulse

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run backend regression tests
        run: |
          python3 -m venv "$RUNNER_TEMP/taskpulse-tests"
          "$RUNNER_TEMP/taskpulse-tests/bin/python" -m pip install 'requests>=2.31,<3'
          "$RUNNER_TEMP/taskpulse-tests/bin/python" -m unittest discover -s tests -v
      - name: Compile the AppKit app
        run: |
          # swiftc 只允许名为 main.swift 的文件写顶层代码，和 packaging/build.sh 一样先改名
          cp pulse.swift "$RUNNER_TEMP/main.swift"
          for arch in arm64 x86_64; do
            swiftc -O -target "$arch-apple-macos13.0" "$RUNNER_TEMP/main.swift" onboarding.swift Bootstrap.swift \
              -framework Cocoa -o "$RUNNER_TEMP/TaskPulse-$arch"
          done
      - name: Smoke test app self-installation
        run: bash tests/check_self_install.sh "$RUNNER_TEMP/TaskPulse-$(uname -m)"
      - name: Verify the standalone web extension
        run: |
          for script in taskpulse-ext/*.js; do
            node --check "$script"
          done
          node --test tests/test_web_extension.cjs
      - name: Check extension and package script syntax
        run: |
          node --check edge-ext/background.js
          node --check edge-ext/web-bridge.js
          for script in packaging/*.sh packaging/*.command; do
            bash -n "$script"
          done

  web-extension-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/taskpulse-browser-tests" playwright@1.57.0
          "$RUNNER_TEMP/taskpulse-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Load the extension in Chromium with a DataAgent fixture
        env:
          NODE_PATH: ${{ runner.temp }}/taskpulse-browser-tests/node_modules
        run: node tests/check_web_extension_browser.cjs
