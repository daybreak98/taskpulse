<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskPulse 设置</title><link rel="stylesheet" href="options.css"></head><body><main>
<header><img src="icon.png" alt=""><div><h1>TaskPulse</h1><p>浏览器任务监控 · WEB</p></div></header>
<section><h2>全网页悬浮胶囊</h2><p>在普通 HTTP/HTTPS 网页显示胶囊和回复提示。任务数据只在扩展自己的隔离界面渲染。启用时由浏览器请求网页访问权限。</p><button id="global" type="button">启用全网页显示</button><p id="status" role="status"></p></section>
<section><h2>显示与分组</h2><p>胶囊与面板空白处支持拖动。DA / TAB 按钮切换平台分组与原生标签组。</p><button id="reset" type="button">恢复胶囊默认位置</button><button id="group" type="button">切换为标签组</button></section>
<section><h2>采集</h2><p>保留至少一个已登录的 DataAgent 页面。活跃任务快速确认，空闲会话低频采集。浏览器特殊页面可用侧栏或系统通知。</p><button id="dataagent" type="button">打开 DataAgent</button></section>
</main><script src="config.js"></script><script src="ui-rules.js"></script><script src="options.js"></script></body></html>
